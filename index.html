<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezeptbuch</title>
<meta name="theme-color" content="#185FA5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1f1e1c;--muted:#6b6a65;--line:#e6e3dc;--soft:#f1efe9;--accent:#185FA5;--on-accent:#fff;--accent-bg:#E6F1FB;--green:#3B6D11;--green-bg:#EAF3DE;--amber:#854F0B;--amber-bg:#FAEEDA;--danger:#A32D2D;--danger-bg:#FCEBEB;--radius:10px}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#21201e;--text:#ecebe6;--muted:#a3a29b;--line:#34332f;--soft:#2a2926;--accent:#85B7EB;--on-accent:#0b1f33;--accent-bg:#0C2E52;--green:#C0DD97;--green-bg:#233a10;--amber:#FAC775;--amber-bg:#4a2f0a;--danger:#F09595;--danger-bg:#4a1717}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:24px 0 8px}
button{font:inherit;font-size:15px;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:500}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--danger)}
button.wide{width:100%}
button[disabled]{opacity:.5}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,textarea,select{font:inherit;font-size:16px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:150px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 5px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 16px}
.banner{background:var(--amber-bg);color:var(--amber);border-radius:var(--radius);padding:10px 12px;font-size:14px;margin-bottom:12px}
.err{color:var(--danger);font-size:14px;margin-top:8px}
/* list */
.search{position:relative;margin-bottom:12px}
.search input{padding-left:38px}
.search .ico{position:absolute;left:12px;top:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%;justify-content:flex-start;min-height:0}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.item .t{font-weight:500;font-size:16px;line-height:1.3}
.item .m{font-size:13px;color:var(--muted);margin-top:3px}
.jobs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.job{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.job.done{border-color:var(--green);background:var(--green-bg)}
.job.error{border-color:var(--danger)}
.job .jt{font-weight:500;font-size:15px;line-height:1.3}
.job .jm{font-size:13px;color:var(--muted);margin-top:2px}
.job.done .jm{color:var(--green)}
.job.error .jm{color:var(--danger)}
.job .jb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.job .jb button{min-height:34px;padding:5px 12px;font-size:14px}
.minispin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
.secTitle{font-size:13px;color:var(--muted);margin:16px 2px 0;text-transform:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1.5px dashed var(--line);border-radius:14px;margin-top:14px}
/* detail (Design B) */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/10;background:var(--soft);margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .chg{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:14px;min-height:36px;padding:6px 12px}
.hero.none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);background:var(--soft);color:var(--muted);cursor:pointer;width:100%}
.hero.none .ico{width:34px;height:34px}
.rtitle{font-size:24px;font-weight:600;line-height:1.25;margin:0;letter-spacing:-.01em}
.rdesc{color:var(--muted);margin:6px 0 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font-size:13px;padding:3px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.chip .ico{width:14px;height:14px}
.c-green{background:var(--green-bg);color:var(--green)}
.c-blue{background:var(--accent-bg);color:var(--accent)}
.c-amber{background:var(--amber-bg);color:var(--amber)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.tile{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}
.tl{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.stepper button{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:var(--card)}
.stepper .v{font-size:22px;font-weight:600;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;border-radius:6px}
.tsub{font-size:12px;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:none;padding:0;min-height:0;color:var(--accent);font-size:12px;text-decoration:underline}
.nutri{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.sec{font-size:17px;font-weight:600;margin:22px 0 6px}
.gname{font-size:14px;font-weight:600;color:var(--accent);margin:14px 0 2px}
.ing{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.ing .box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ing.on .box{background:var(--green);border-color:var(--green)}
.ing.on .box::after{content:"";width:9px;height:5px;border-left:2px solid var(--card);border-bottom:2px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.ing .n{flex:1;min-width:0}
.ing .n small{color:var(--muted);font-size:13px}
.ing .a{color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ing.on .n,.ing.on .a{text-decoration:line-through;opacity:.55}
.step{display:flex;gap:12px;padding:10px 0;cursor:pointer}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step.on .num{background:var(--green-bg);color:var(--green)}
.step.on .txt{opacity:.5}
.tips{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:15px}
.tips ul{margin:4px 0 0;padding-left:18px}
.src{font-size:13px;color:var(--muted);margin-top:16px;word-break:break-word}
.src a{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions button{flex:1}
@media (min-width:700px){
 .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* import */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:6px 0 4px}
.seg button{border:none;background:transparent;min-height:40px}
.seg button.on{background:var(--card);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--card)}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.drop .ico{width:32px;height:32px}
.prevs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.prev{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft)}
.prev img{width:100%;height:100%;object-fit:cover}
.prev button{position:absolute;top:4px;right:4px;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none}
.imgedit{display:flex;gap:12px;align-items:center}
.imgedit img,.imgedit .ph{width:110px;height:80px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg p{margin:0 0 14px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.fab{position:fixed;right:18px;bottom:22px;border-radius:28px;min-height:52px;padding:0 20px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:20}
.hidden{display:none!important}
label.pickbtn,label.chg,label.hero{position:relative;overflow:hidden;cursor:pointer}
label.pickbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:12px;min-height:76px;font-size:15px;text-align:center}
label.pickbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:500}
.imgedit label.pickbtn{flex-direction:row;min-height:42px;padding:9px 14px}
label.chg{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius)}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
@media print{button,.top,.actions,.hero .chg,.fab{display:none!important}body{background:#fff}.rcard{border:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p style="color:var(--muted)">Lade Rezepte …</p></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- Grundlagen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',

  chef:'<path d="M7 14a4 4 0 01-1-7.9A5 5 0 0116 5a4 4 0 011 9v5H7z"/><path d="M7 17h10"/>'
};
const ico = (n, cls="ico") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const IMG_MAX = 5;
let dbChecked = false;
let ME = null; // { user, ai }
const hasAI = () => !!(ME && ME.ai);
async function api(path, opts = {}){
  let r;
  const headers = { ...(typeof opts.body === "string" ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) };
  try { r = await fetch("api/" + path, { credentials: "same-origin", ...opts, headers }); }
  catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled" }; throw { code: "network" }; }

  const body = ct.includes("json") ? await r.json().catch(() => null) : null;
  if (r.status === 401 && path !== "login") { ME = null; hideBusy(); view = "login"; render(); throw { code: "login" }; }
  if (!r.ok) throw { code: (body && body.code) || "http" + r.status, message: body && body.message, status: r.status };
  return body;
}
async function reloadRecipes(){ const list = await api("recipes"); recipes = Array.isArray(list) ? list : []; }
async function reloadJobs(){ try { const list = await api("jobs"); jobs = Array.isArray(list) ? list : []; } catch (e) {} }
const jobsActive = () => jobs.some(j => j.status === "queued" || j.status === "running");
function imgUrl(r){ return imgCache[r.id] || (r.hasImage ? "api/images/" + r.id + "?v=" + (r.imgV || r.updatedAt || 0) : ""); }
let recipes = [];
let jobs = [];            // {id, ...daten}
const imgCache = {};          // id -> dataURL (großes Bild)
const vs = {};                // Ansichtszustand je Rezept
let view = "list", curId = null, draft = null, query = "";
const imp = { mode: "link", files: [], err: "" };

function toast(msg, ms = 2600){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function newId(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
const de = v => String(v).replace(".", ",");
const numOrNull = x => { const n = typeof x === "string" ? parseFloat(x.replace(",", ".")) : Number(x); return Number.isFinite(n) ? n : null; };
const str = x => (x == null ? "" : String(x)).trim();
const arr = x => Array.isArray(x) ? x : [];

/* ---------- Mengen ---------- */
const FR = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125};
function parseNum(s){
  s = String(s).trim(); if (!s) return null; let m;
  if (FR[s] != null) return FR[s];
  if ((m = s.match(/^(\d+)\s*([½¼¾⅓⅔⅛])$/))) return +m[1] + FR[m[2]];
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  const n = parseFloat(s.replace(",", ".")); return isNaN(n) ? null : n;
}
function fmtVal(v, unit){
  if (unit === "g" || unit === "ml") { if (v < 10) return de(round(v, 1)); if (v < 100) return de(Math.round(v)); return de(Math.round(v / 5) * 5); }
  if (unit === "kg" || unit === "l") return de(round(v, v < 10 ? 2 : 1));
  if (unit === "cl" || unit === "dl" || unit === "mg") return de(round(v, 1));
  if (v >= 10) return de(Math.round(v));
  const q = Math.round(v * 4) / 4;
  if (q === 0) return de(round(v, 2));
  const w = Math.floor(q), fr = q - w, fs = fr === .25 ? "¼" : fr === .5 ? "½" : fr === .75 ? "¾" : "";
  return w ? (fs ? w + fs : String(w)) : fs;
}
function fmtQty(it, f){
  if (it.amount == null) return "";
  let a = it.amount * f, b = it.amountMax != null ? it.amountMax * f : null, unit = it.unit || "";
  if (unit === "g" && a >= 1000) { a /= 1000; if (b != null) b /= 1000; unit = "kg"; }
  else if (unit === "ml" && a >= 1000) { a /= 1000; if (b != null) b /= 1000; unit = "l"; }
  const s = (b != null && Math.abs(b - a) > 1e-9) ? fmtVal(a, unit) + "–" + fmtVal(b, unit) : fmtVal(a, unit);
  return s + (unit ? " " + unit : "");
}
const UNITS = ["g","kg","mg","ml","l","cl","dl","EL","TL","Msp.","Msp","Prise","Prisen","Stück","Stk.","Stk","Bund","Dose","Dosen","Zehe","Zehen","Pck.","Pck","Päckchen","Packung","Scheibe","Scheiben","Becher","Tasse","Tassen","Handvoll","Zweig","Zweige","Blatt","Blätter","Glas","Gläser","Kopf","Stange","Stangen","Knolle","Knollen","Würfel","Tropfen","Spritzer","Schuss","Tüte","Beutel","Riegel","Tafel","Pkg."];
const NUM_RE = /^((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d+\s*[½¼¾⅓⅔⅛])|[½¼¾⅓⅔⅛]|(?:\d+(?:[.,]\d+)?))(?:\s*[-–]\s*((?:\d+\/\d+)|(?:\d+(?:[.,]\d+)?)))?\s*/;
function parseIngLine(line){
  let s = line.trim().replace(/^[-•*]\s*/, "").replace(/\((n|e|s|en|er)\)/g, "").replace(/\s+/g, " "); if (!s) return null;
  let amount = null, amountMax = null, unit = "";
  const m = s.match(NUM_RE);
  if (m) { amount = parseNum(m[1]); if (m[2]) amountMax = parseNum(m[2]); s = s.slice(m[0].length); }
  const um = s.match(/^(\S+)\s+/);
  if (um) { const u = UNITS.find(x => x.toLowerCase() === um[1].toLowerCase()); if (u) { unit = u; s = s.slice(um[0].length); } }
  let name = s.trim(), note = ""; const ci = name.indexOf(",");
  if (ci > 0) { note = name.slice(ci + 1).trim(); name = name.slice(0, ci).trim(); }
  if (!name) return null;
  return { amount, amountMax, unit, name, note };
}
const plainNum = v => de(round(v, 3));
function ingToLine(it){
  let s = "";
  if (it.amount != null) s += plainNum(it.amount) + (it.amountMax != null ? "-" + plainNum(it.amountMax) : "") + " ";
  if (it.unit) s += it.unit + " ";
  s += it.name; if (it.note) s += ", " + it.note; return s;
}
function groupsToText(groups){
  return arr(groups).map(g => (g.name ? g.name.replace(/:$/, "") + ":\n" : "") + arr(g.items).map(ingToLine).join("\n")).join("\n\n");
}
function textToGroups(t){
  const groups = []; let cur = { name: "", items: [] };
  for (const raw of t.split("\n")) {
    const line = raw.trim(); if (!line) continue;
    if (/:\s*$/.test(line) && !NUM_RE.test(line)) { if (cur.items.length || cur.name) groups.push(cur); cur = { name: line.replace(/:\s*$/, ""), items: [] }; continue; }
    const it = parseIngLine(line); if (it) cur.items.push(it);
  }
  if (cur.items.length) groups.push(cur);
  return groups.filter(g => g.items.length);
}
const textToList = t => t.split("\n").map(s => s.trim().replace(/^(\d+[.)]|[-•*])\s*/, "")).filter(Boolean);

function fmtMin(m){ if (!m) return ""; m = Math.round(m); if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + " Std." + (r ? " " + r + " min" : ""); }
function timeLabel(r){ return fmtMin(r.totalTime || r.prepTime); }

/* ---------- Ansichtszustand: Portionen & kcal ---------- */
function getVS(r){
  if (!vs[r.id]) vs[r.id] = { servings: r.servings || 4, kcalPP: r.kcal || null, checked: new Set(), done: new Set() };
  return vs[r.id];
}
function factorFor(r, servings, kcalPP){
  let f = servings / (r.servings || 1);
  if (r.kcal && kcalPP) f *= kcalPP / r.kcal;
  return f;
}

/* ---------- Bilder ---------- */
function loadImgEl(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht geladen werden")); i.src = src; }); }
async function blobToImg(blob){ const u = URL.createObjectURL(blob); try { return await loadImgEl(u); } finally { setTimeout(() => URL.revokeObjectURL(u), 4000); } }
function canvasOf(w, h){ const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
// Foto für die KI vorbereiten (JPEG, max 2000 px)
async function prepForAI(file){
  const img = await blobToImg(file);
  const s = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = canvasOf(img.naturalWidth * s, img.naturalHeight * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.9));
}
// Rezeptbild erzeugen: großes Bild (<= ~230 KB) + Vorschaubild
async function makeRecipeImages(blob, box){
  const img = await blobToImg(blob);
  let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
  if (box) { sx = box.x * sw; sy = box.y * sh; const w2 = box.b * sw, h2 = box.h * sh; sw = w2; sh = h2; }
  let maxSide = 1400, q = 0.82, full = "";
  for (let i = 0; i < 6; i++) {
    const s = Math.min(1, maxSide / Math.max(sw, sh));
    const c = canvasOf(sw * s, sh * s); const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    full = c.toDataURL("image/jpeg", q);
    if (full.length < 235000) break;
    maxSide = Math.round(maxSide * 0.8); q = Math.max(0.6, q - 0.06);
  }
  const t = canvasOf(200, 200), tg = t.getContext("2d");
  const ts = Math.max(200 / sw, 200 / sh);
  tg.drawImage(img, sx, sy, sw, sh, (200 - sw * ts) / 2, (200 - sh * ts) / 2, sw * ts, sh * ts);
  return { full, thumb: t.toDataURL("image/jpeg", 0.7) };
}
async function coverCrop(dataUrl, w, h){
  const img = await loadImgEl(dataUrl);
  const c = canvasOf(w, h), g = c.getContext("2d");
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  g.drawImage(img, (w - img.naturalWidth * s) / 2, (h - img.naturalHeight * s) / 2, img.naturalWidth * s, img.naturalHeight * s);
  return c.toDataURL("image/jpeg", 0.85);
}
async function loadImage(id){
  if (imgCache[id]) return imgCache[id];
  const r = recipes.find(x => x.id === id); if (!r || !r.hasImage) return null;
  try { const res = await fetch(imgUrl(r)); if (!res.ok) return null; return await blobToDataURL(await res.blob()); } catch (e) { return null; }
}

/* ---------- Speichern (auf dem Server) ---------- */
function dbErrText(e){
  if (e && e.code === "network") return "Keine Verbindung zum Server.";
  if (e && e.code === "login") return "Bitte neu anmelden.";
  return (e && e.message) || "Speichern hat nicht geklappt. Bitte noch einmal versuchen.";
}
async function saveImage(id, img){
  if (img) { await api("images/" + id, { method: "PUT", body: JSON.stringify({ data: img.full }) }); imgCache[id] = img.full; }
  else { await api("images/" + id, { method: "DELETE" }); delete imgCache[id]; }
}
async function saveRecipe(rec){
  const clean = JSON.parse(JSON.stringify(rec));
  const saved = await api("recipes/" + clean.id, { method: "PUT", body: JSON.stringify(clean) });
  const i = recipes.findIndex(r => r.id === saved.id); if (i >= 0) recipes[i] = saved; else recipes.push(saved);
  return saved;
}
async function deleteRecipe(id){
  await api("recipes/" + id, { method: "DELETE" });
  recipes = recipes.filter(r => r.id !== id);
  delete imgCache[id]; delete vs[id];
}
function downloadBlob(blob, name){
  const u = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
async function exportBackup(){
  showBusy("Erstelle Sicherung …"); const sb = $("[data-a=stopbusy]"); if (sb) sb.remove();
  try {
    const r = await fetch("api/backup"); if (!r.ok) throw new Error();
    downloadBlob(await r.blob(), "rezeptbuch-sicherung-" + new Date().toISOString().slice(0, 10) + ".json");
    hideBusy(); toast("Sicherung gespeichert (Ordner „Downloads“)", 3500);
  } catch (e) { hideBusy(); toast("Sicherung nicht möglich."); }
}
async function importBackup(file){
  showBusy("Spiele Sicherung ein …"); const sb = $("[data-a=stopbusy]"); if (sb) sb.remove();
  try {
    const text = await file.text();
    const j = JSON.parse(text); if (!j || !Array.isArray(j.recipes)) throw { message: "Die Datei ist keine gültige Sicherung." };
    const res = await api("import", { method: "POST", body: text });
    await reloadRecipes(); hideBusy(); toast((res && res.count) + " Rezepte eingespielt");
  } catch (e) { hideBusy(); toast(e && e.message ? e.message : "Die Datei ist keine gültige Sicherung.", 4000); }
}

  let list = recipes.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

function detailView(r){
  const s = getVS(r), f = factorFor(r, s.servings, s.kcalPP);
  const src = imgUrl(r) || r.thumb || "";
  const hero = r.hasImage
    ? `<div class="hero"><img id="heroImg" src="${esc(src)}" alt="${esc(r.title)}"><label class="chg">${ico("camera")} Bild ändern<input type="file" class="fileov img-in" data-t="detail" accept="image/*"></label></div>`

  const chips = [
    ...arr(r.tags).map(t => `<span class="chip c-green">${esc(t)}</span>`),
    timeLabel(r) ? `<span class="chip c-blue">${ico("clock")} ${esc(timeLabel(r))}</span>` : "",
    r.difficulty ? `<span class="chip c-amber">${esc(r.difficulty)}</span>` : ""
  ].join("");
  const kcalChanged = r.kcal && s.kcalPP && Math.round(s.kcalPP) !== Math.round(r.kcal);
  const kcalTile = r.kcal
    ? `<div class="tile"><div class="tl">kcal pro Portion</div><div class="stepper"><button data-a="kc-" aria-label="weniger kcal">−</button><span class="v" data-a="kcset">${Math.round(s.kcalPP)}</span><button data-a="kc+" aria-label="mehr kcal">+</button></div>
       <div class="tsub">${r.kcalEstimated ? "geschätzt · " : ""}gesamt ${Math.round(s.kcalPP * s.servings)}${kcalChanged ? ` · <button class="linkbtn" data-a="kcreset">zurück</button>` : ""}</div></div>`
    : `<div class="tile"><div class="tl">kcal pro Portion</div><div class="stepper"><span class="v" style="color:var(--muted)">–</span></div><div class="tsub">${hasAI() ? `<button class="linkbtn" data-a="kcestimate">schätzen lassen</button>` : "&nbsp;"}</div></div>`;
  let nutri = "";
  if (r.nutrition && (r.nutrition.protein || r.nutrition.carbs || r.nutrition.fat)) {
    const k = r.kcal && s.kcalPP ? s.kcalPP / r.kcal : 1;
    nutri = `<p class="nutri">pro Portion: Eiweiß ${Math.round((r.nutrition.protein || 0) * k)} g · Kohlenhydrate ${Math.round((r.nutrition.carbs || 0) * k)} g · Fett ${Math.round((r.nutrition.fat || 0) * k)} g</p>`;

  const ings = arr(r.groups).map((g, gi) => `${g.name ? `<div class="gname">${esc(g.name)}</div>` : ""}${arr(g.items).map((it, ii) => {
    const k = gi + "-" + ii, on = s.checked.has(k);
    return `<div class="ing${on ? " on" : ""}" data-a="ing" data-k="${k}"><span class="box"></span><span class="n">${esc(it.name)}${it.note ? ` <small>${esc(it.note)}</small>` : ""}</span><span class="a">${esc(fmtQty(it, f))}</span></div>`;

function parseJSONLoose(t){

function extractUrl(s){ const m = String(s || "").match(/https?:\/\/[^\s"'<>]+/); return m ? m[0].replace(/[).,;!?]+$/, "") : ""; }
function decodeEnt(s){ const t = document.createElement("textarea"); t.innerHTML = String(s ?? "").replace(/<[^>]+>/g, " "); return t.value.replace(/\s+/g, " ").trim(); }
function isoMin(s){ const m = String(s || "").match(/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/i); if (!m) return null; const v = (+(m[1] || 0)) * 1440 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)); return v || null; }

function ldSteps(ins){
  const out = [];

    if (!x) return;
    if (typeof x === "string") { x.replace(/<br\s*\/?>|<\/p>|<\/li>/gi, "\n").split(/\n+/).map(decodeEnt).filter(Boolean).forEach(s => out.push(s)); return; }
    if (Array.isArray(x)) { x.forEach(go); return; }
    if (x.itemListElement) { go(x.itemListElement); return; }
    if (x.text) go(x.text); else if (x.name) go(x.name);
  };
  go(ins);
  return out.map(s => s.replace(/^(\d+[.)]|Schritt\s*\d+:?)\s*/i, "")).filter(Boolean);
}
function findRecipeLD(html){
  let doc; try { doc = new DOMParser().parseFromString(html, "text/html"); } catch (e) { return null; }
  const isRecipe = o => { const t = o && o["@type"]; return t === "Recipe" || (Array.isArray(t) && t.includes("Recipe")); };
  const walk = o => {
    if (!o || typeof o !== "object") return null;
    if (Array.isArray(o)) { for (const x of o) { const r = walk(x); if (r) return r; } return null; }
    if (isRecipe(o)) return o;
    if (o["@graph"]) return walk(o["@graph"]);
    if (o.mainEntity) return walk(o.mainEntity);
    return null;
  };
  for (const n of doc.querySelectorAll('script[type="application/ld+json"]')) {
    const raw = n.textContent.trim();
    for (const t of [raw, raw.replace(/[\u0000-\u001F]+/g, " ")]) { try { const r = walk(JSON.parse(t)); if (r) return r; break; } catch (e) {} }
  }
  return null;
}
function fromLD(o, url){
  const n = o.nutrition || {};
  const tags = [];
  [].concat(o.recipeCategory || [], o.recipeCuisine || []).map(decodeEnt).forEach(k => k.split(",").forEach(x => { x = x.trim(); if (x && tags.length < 4 && !tags.includes(x)) tags.push(x); }));
  let host = ""; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
  const items = [].concat(o.recipeIngredient || o.ingredients || []).map(s => parseIngLine(decodeEnt(s))).filter(Boolean);
  const prep = isoMin(o.prepTime), cook = isoMin(o.cookTime);
  return {
    id: newId(), _new: true, _fromLD: true,
    title: decodeEnt(o.name) || "Rezept", description: decodeEnt(o.description).slice(0, 220),
    servings: firstNum(o.recipeYield) || 4, servingsUnit: "Portionen",
    prepTime: prep, totalTime: isoMin(o.totalTime) || ((prep || 0) + (cook || 0)) || null, difficulty: "",
    tags, kcal: firstNum(n.calories), kcalEstimated: false,
    nutrition: (n.proteinContent || n.carbohydrateContent || n.fatContent) ? { protein: firstNum(n.proteinContent), carbs: firstNum(n.carbohydrateContent), fat: firstNum(n.fatContent) } : null,
    groups: items.length ? [{ name: "", items }] : [], steps: ldSteps(o.recipeInstructions), tips: [],
    source: host, sourceUrl: url, hasImage: false, thumb: "", _imgUrl: ldImage(o.image)

function absUrl(u, base){ try { return new URL(u, base).toString(); } catch (e) { return ""; } }
function ogImage(html, base){
  try { const doc = new DOMParser().parseFromString(html, "text/html"); const m = doc.querySelector('meta[property="og:image"],meta[name="og:image"],meta[name="twitter:image"],meta[property="twitter:image"]'); return m ? absUrl(m.getAttribute("content") || "", base) : ""; } catch (e) { return ""; }

function pageText(html, base){

    const imgs = [...doc.querySelectorAll("img")].map(i => absUrl(i.getAttribute("data-src") || i.getAttribute("src") || "", base)).filter(s => /^https?:/.test(s)).slice(0, 25);

/* ---------- KI: Einlesen ---------- */
function buildPrompt(kind, count, text, url, hint){
  return `Du überführst Rezepte in ein einheitliches Format.
QUELLE: ${kind === "foto" ? `${count} Bild(er) (Fotos aus einem Buch oder Screenshots), in Reihenfolge – gemeinsam ergeben sie EIN Rezept, sofern nicht anders erkennbar.` : "Text, der von einer Webseite oder aus einem Dokument kopiert wurde (kann Werbung, Kommentare und Navigation enthalten – ignorieren)."}
${url ? "LINK DER QUELLE: " + url + "\n" : ""}${hint ? "HINWEIS DES NUTZERS: " + hint + "\n" : ""}
Antworte NUR mit einem JSON-Objekt in genau diesem Format:
{"titel":"","beschreibung":"","portionen":4,"portionsEinheit":"Portionen","arbeitszeit":20,"gesamtzeit":45,"schwierigkeit":"einfach","tags":["vegetarisch","Hauptgericht"],"kcalProPortion":450,"kcalGeschaetzt":true,"naehrwerte":{"eiweiss":18,"kohlenhydrate":50,"fett":15},"zutatenGruppen":[{"name":"","zutaten":[{"menge":200,"mengeBis":null,"einheit":"g","name":"rote Linsen","hinweis":"gewaschen"}]}],"schritte":["…"],"tipps":["…"],"quelle":"","bildAusschnitt":null${kind === "text" ? ',"bildUrl":""' : ""}}

REGELN:
- Alles auf Deutsch (übersetzen, falls nötig). Titel ohne Zusätze wie „Rezept“ oder „einfach & lecker“.
- beschreibung: höchstens ein kurzer Satz, sonst "".
- menge als Zahl (½ → 0.5, 1 ½ → 1.5); Bereich wie 2–3 → menge 2, mengeBis 3. „nach Geschmack“, „etwas“: menge null, hinweis z. B. "nach Geschmack".
- einheit nur eine von: g, kg, ml, l, EL, TL, Prise, Msp., Bund, Dose, Zehe, Pck., Scheibe, Becher, Zweig, Handvoll – oder "" bei Stückzahlen (z. B. 2 Zwiebeln → menge 2, einheit "").
- Amerikanische Maße (cups, oz, lb, sticks, °F) in g/ml/°C umrechnen.
- name = die Zutat selbst; Zubereitungsangaben (gewürfelt, zimmerwarm) in hinweis.
- zutatenGruppen: nur benennen, wenn die Quelle Gruppen hat (z. B. "Für den Teig"); sonst eine Gruppe mit name "".
- schritte: vollständig, ein Arbeitsschritt pro Eintrag, klar formuliert, mit Temperaturen und Zeiten; nichts erfinden, nichts weglassen. Keine Nummerierung im Text.
- tipps: Hinweise/Varianten aus der Quelle, sonst [].
- portionen: aus der Quelle; fehlt die Angabe, sinnvoll schätzen.
- arbeitszeit/gesamtzeit in Minuten oder null.
- schwierigkeit: "einfach", "mittel", "anspruchsvoll" oder null.
- tags: 2–5 kurze Schlagworte (z. B. vegan, vegetarisch, Hauptgericht, Suppe, Salat, Backen, Dessert, schnell).
- kcalProPortion: aus der Quelle (kcalGeschaetzt false). Fehlt sie, aus den Zutaten realistisch schätzen (kcalGeschaetzt true). naehrwerte (g pro Portion) ebenso, sonst schätzen.
- quelle: Buchtitel/Seitenzahl, Zeitschrift oder Name der Webseite, falls erkennbar, sonst "".
- bildAusschnitt: Nur wenn auf einem der Bilder ein FOTO des fertigen Gerichts zu sehen ist: {"bild":0,"x":0.1,"y":0.05,"b":0.8,"h":0.4} – bild = Index (0-basiert), x/y = linke obere Ecke, b/h = Breite/Höhe, alles als Anteil 0–1 der Bildgröße, nur der Fotobereich ohne Text und Ränder. Sonst null.
- Mehrere Rezepte in der Quelle: das Hauptrezept bzw. das im Hinweis genannte nehmen.
- Ist kein Rezept erkennbar, antworte {"fehler":"kurze Begründung"}.${kind === "text" ? "\n- bildUrl: vollständige URL des Hauptfotos des Gerichts, falls im Text als Bild-Link enthalten, sonst \"\"." : ""}
${kind === "text" ? "\nTEXT:\n" + text : ""}`;
}

const PT = 0.3528, LHF = 1.18;
const lh = fs => fs * PT * LHF;

const PDF_OK = new Set("€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ");
function P(s){
  s = String(s ?? "").replace(/⅓/g, "1/3").replace(/⅔/g, "2/3").replace(/⅛/g, "1/8").replace(/≈/g, "ca. ").replace(/→/g, "->").replace(/[   ]/g, " ").replace(/[‐‑]/g, "-");

}

  rmfile(el, e){ e.stopPropagation(); readImportInputs(); const i = +el.dataset.i; const f = imp.files[i]; if (f) URL.revokeObjectURL(f.url); imp.files.splice(i, 1); render(); },
  runimport(){ runImport(); },
  manual(){ readImportInputs(); draft = { id: newId(), _new: true, title: "", description: "", servings: 4, servingsUnit: "Portionen", tags: [], groups: [], steps: imp.text ? textToList(imp.text) : [], tips: [], source: "", sourceUrl: imp.url || "", hasImage: false, thumb: "" }; view = "edit"; render(); window.scrollTo(0, 0); },
  stopbusy(){ if (busyCtl) busyCtl.abort(); hideBusy(); },
  edit(){ const r = recipes.find(x => x.id === curId); if (!r) return; draft = JSON.parse(JSON.stringify(r)); view = "edit"; render(); window.scrollTo(0, 0); if (r.hasImage && !imgCache[r.id]) loadImage(r.id).then(d => { const el = $("#editImg"); if (d && el) el.src = d; }); },
  canceledit(){ const fromJob = draft && draft._jobId; const wasNew = draft && draft._new; draft = null; view = fromJob ? "list" : (wasNew ? "import" : "detail"); render(); },
  jobopen(el){ openJob(el.dataset.id); },
  async jobcancel(el){ const id = el.dataset.id; const j = jobs.find(x => x.id === id); if (j && j.status === "done" && !(await ask("Das eingelesene Rezept verwerfen?", "Verwerfen", true))) return; try { await api("jobs/" + id, { method: "DELETE" }); } catch (e) {} jobs = jobs.filter(x => x.id !== id); refreshJobsBlock(); if (!recipes.length) render(); },
  async jobretry(el){ try { await api("jobs/" + el.dataset.id + "/retry", { method: "POST" }); } catch (e) {} await reloadJobs(); refreshJobsBlock(); startJobPolling(); },
  saveedit(){ saveDraft(); },
  editimgrm(){ readDraftFields(); draft._img = null; draft._imgChanged = true; draft.hasImage = false; draft.thumb = ""; render(); },
  estimate(){ estimateKcal(true); },
  kcestimate(){ estimateKcal(false); },
  ing(el){ const r = recipes.find(x => x.id === curId); const s = getVS(r); const k = el.dataset.k; s.checked.has(k) ? s.checked.delete(k) : s.checked.add(k); el.classList.toggle("on"); },
  step(el){ const r = recipes.find(x => x.id === curId); const s = getVS(r); const k = +el.dataset.k; s.done.has(k) ? s.done.delete(k) : s.done.add(k); el.classList.toggle("on"); },
  "sv-"(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.servings = Math.max(1, Math.ceil(s.servings) - 1); render(); },
  "sv+"(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.servings = Math.floor(s.servings) + 1; render(); },
  svreset(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.servings = r.servings; render(); },
  "kc-"(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.kcalPP = Math.max(50, Math.round((s.kcalPP - 25) / 25) * 25); render(); },
  "kc+"(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.kcalPP = Math.round((s.kcalPP + 25) / 25) * 25; render(); },
  kcreset(){ const r = recipes.find(x => x.id === curId), s = getVS(r); s.kcalPP = r.kcal; render(); },
  async kcset(){ const r = recipes.find(x => x.id === curId), s = getVS(r); const n = await askNumber("Gewünschte kcal pro Portion – die Mengen werden passend umgerechnet:", Math.round(s.kcalPP)); if (n && n >= 30) { s.kcalPP = n; render(); } },
  pdf(){ pdfOne(); },
  settings(){ readImportInputs(); prevView = view; view = "settings"; render(); window.scrollTo(0, 0); },
  async logout(){ try { await api("logout", { method: "POST" }); } catch (e) {} ME = null; recipes = []; jobs = []; for (const k in imgCache) delete imgCache[k]; view = "login"; if (location.hash) location.hash = ""; render(); },
  reload(){ location.reload(); },
  export(){ exportBackup(); },
  bookpdf(){ pdfBook(); },
  async del(){ const r = recipes.find(x => x.id === curId); if (!r) return; if (!(await ask(`„${r.title}“ wirklich löschen?`, "Löschen", true))) return; try { await deleteRecipe(r.id); view = "list"; curId = null; if (location.hash) location.hash = ""; render(); toast("Gelöscht"); } catch (e) { toast(dbErrText(e)); } }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; const fn = H[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; const li = $("#listItems"); if (li) li.innerHTML = listItems(); }
  if (e.target.id === "eKcal" && draft) { draft.kcalEstimated = false; draft._kcalEst = null; const h = $("#kcalHint"); if (h) h.textContent = ""; }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.classList) return;
  if (t.classList.contains("imp-in")) { const fl = [...(t.files || [])]; t.value = ""; addImportFiles(fl); }
  else if (t.classList.contains("img-in")) onRecipeImage(e);
  else if (t.classList.contains("backup-in")) { const f = t.files && t.files[0]; t.value = ""; if (f) importBackup(f); }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); addImportFiles(e.dataTransfer.files); } });
document.addEventListener("paste", e => {
  if (view !== "import" || imp.mode !== "foto") return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addImportFiles(files); }
});
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#r-([A-Za-z0-9]+)$/);
  if (m && recipes.some(r => r.id === m[1])) { if (view === "list" || view === "detail") { curId = m[1]; view = "detail"; render(); } }
  else if (view === "detail") { view = "list"; render(); }
});

/* ---------- Start ---------- */
function applyHashOnce(){ const m = location.hash.match(/^#r-([A-Za-z0-9]+)$/); if (m && recipes.some(r => r.id === m[1])) { curId = m[1]; view = "detail"; } }
async function startApp(){
  try { ME = await api("me"); }
  catch (e) {
    if (e && e.code === "login") return;
    $("#app").innerHTML = `<div class="banner" style="margin-top:20px">Der Server ist gerade nicht erreichbar. Prüfe die Internetverbindung.</div><button class="wide" data-a="reload">Erneut versuchen</button>`;
    return;
  }
  try { await reloadRecipes(); } catch (e) {}
  await reloadJobs(); if (jobsActive()) startJobPolling();
  dbChecked = true; view = "list"; applyHashOnce(); render();
  let shared = ""; try { shared = sessionStorage.getItem("pendingShare") || ""; sessionStorage.removeItem("pendingShare"); } catch (e) {}
  if (shared) { imp.mode = "link"; imp.url = shared; imp.err = ""; view = "import"; render(); importLink(); }
}
document.addEventListener("submit", async e => {
  if (!e.target || e.target.id !== "loginForm") return;
  e.preventDefault();
  const err = $("#lErr"); err.textContent = "";
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try { await api("login", { method: "POST", body: JSON.stringify({ user: $("#lUser").value, password: $("#lPw").value }) }); await startApp(); }
  catch (x) { err.textContent = (x && x.message) || (x && x.code === "network" ? "Server nicht erreichbar." : "Anmeldung fehlgeschlagen."); }
  finally { btn.disabled = false; }
});
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !ME || (view !== "list" && view !== "detail")) return;
  try { await reloadRecipes(); await reloadJobs(); if (jobsActive()) startJobPolling(); render(); } catch (e) {}
});
(function init(){
  const q = new URLSearchParams(location.search);
  const shared = extractUrl(q.get("url")) || extractUrl(q.get("text")) || extractUrl(q.get("title"));
  if (q.has("url") || q.has("text") || q.has("title")) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  if (shared) { try { sessionStorage.setItem("pendingShare", shared); } catch (e) {} }
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  startApp();
})();
</script>
</body>
